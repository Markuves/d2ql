experiment:
  id: "h4_native_precision"
  hypothesis: "H4"
  seed: 42
  description: >
    Native bit-width training from initialization, with a shared capacity
    sweep. Every precision starts at the same hidden width; larger widths
    drop higher-precision models so they are not trained when they would
    be too slow. Lower-precision models keep scaling width to test whether
    extra neurons can match higher-precision quality at lower latency.

    This is not H2 post-training quantization and not quantization-aware
    training. INT4/INT8 live on a signed integer grid; ternary uses BitNet-style
    weights in {-1, 0, +1}. 16/32 use native floating-point dtypes (no AMP).

datacenter:
  n_cloud_hosts: 4
  n_edge_nodes: 0

py4j:
  host: "java-sim"
  port: 25333

workload:
  trace_path: "data/workload.csv.gz"
  episode_length: 50
  shuffle: false

queue:
  urgency_weight: 0.6
  demand_weight: 0.4

agent:
  precision: "32"          # overridden per run from native_precision.bits
  hidden_size: 256         # overridden per run from native_precision.capacity
  n_hidden_layers: 2
  learning_rate: 0.0005
  gamma: 0.98
  target_update_freq: 750
  batch_size: 64
  replay_buffer_capacity: 100_000
  replay_buffer_warmup: 2000
  gradient_clip_norm: 10.0
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay: 0.995
  per_alpha: 0.6
  per_beta_start: 0.4
  per_beta_end: 1.0

training:
  n_episodes: 600
  eval_every_n_episodes: 50
  checkpoint_dir: "outputs/checkpoints/h4"
  tensorboard_dir: "outputs/tensorboard"

reward:
  target_utilization: 0.70
  migration_penalty: 0.10
  weight_lr: 0.01
  w_perf_floor: 0.2
  w_energy_floor: 0.1
  w_cost_floor: 0.1
  w_perf_init: 0.4
  w_energy_init: 0.3
  w_cost_init: 0.3

# Train a separate agent from scratch at each bit-width.
native_precision:
  enabled: true
  bits: [ternary, 4, 8, 16, 32]
  quantize_activations: true
  learning_rate_overrides:
    ternary: 0.00005
    4: 0.0001
    8: 0.0002
    16: 0.0003
    32: 0.0005
  # Shared starting width, then scale up. Higher precision stops earlier.
  capacity:
    hidden_sizes: [256, 512, 1024, 2048, 4096]
    n_hidden_layers: 2
    max_hidden_size:
      32: 256
      16: 512
      8: 1024
      4: 2048
      ternary: 4096
