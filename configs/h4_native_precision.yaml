experiment:
  id: "h4_native_precision"
  hypothesis: "H4"
  seed: 42
  # P2: each (precision, device, hidden) configuration is replicated once per
  # seed. A single seed with 10 eval episodes cannot separate a real effect from
  # run-to-run noise, so every cell is repeated here.
  seeds: [42, 43, 44]
  description: >
    Native bit-width training from initialization, with a shared capacity
    sweep. Every precision starts at the same hidden width; larger widths
    drop higher-precision models so they are not trained when they would
    be too slow. Lower-precision models keep scaling width to test whether
    extra neurons can match higher-precision quality at lower latency.

    This is not H2 post-training quantization and not quantization-aware
    training. Ternary uses BitNet-style weights in {-1, 0, +1}; 32 uses the
    native float32 dtype. fp16 and bf16 run under AMP autocast over fp32 master
    weights (see agent.py): fp16 with a GradScaler, bf16 without one because its
    exponent range already matches fp32.

datacenter:
  n_cloud_hosts: 4
  n_edge_nodes: 0

py4j:
  host: "java-sim"
  port: 25333

workload:
  trace_path: "data/workload.csv.gz"
  episode_length: 50
  shuffle: false
  # C1 fix: hold out the trailing fraction of episode windows for a clean,
  # unseen-workload evaluation after training.
  holdout_frac: 0.2
  simulation_time_scale: 0.05

# C1 fix: deterministic, epsilon-free held-out evaluation (business metrics).
evaluation:
  n_episodes: 10

queue:
  urgency_weight: 0.6
  demand_weight: 0.4

agent:
  precision: "32"          # overridden per run from native_precision.precisions
  hidden_size: 256         # overridden per run from native_precision.capacity
  n_hidden_layers: 2       # H4 overrides this from native_precision.capacity.n_hidden_layers
  learning_rate: 0.0005
  gamma: 0.98
  target_update_freq: 750
  batch_size: 64
  replay_buffer_capacity: 100_000
  replay_buffer_warmup: 2000
  gradient_clip_norm: 10.0
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay: 0.995
  per_alpha: 0.6
  per_beta_start: 0.4
  per_beta_end: 1.0

training:
  n_episodes: 400
  eval_every_n_episodes: 50
  checkpoint_dir: "outputs/checkpoints/h4"
  tensorboard_dir: "outputs/tensorboard"

# Stop each (precision, hidden_size, seed) run as soon as its evaluation reward
# plateaus, instead of always running the full n_episodes budget. The metric
# is the mean reward over a trailing window of `window_size` evaluations;
# after `patience` consecutive evaluations without a new best window we halt.
early_stopping:
  enabled: true
  patience: 3            # evaluations to wait for improvement before stopping
  window_size: 3         # evaluations averaged into the comparison metric
  min_evaluations: 4     # never stop before this many evaluations
  min_delta: 0.001       # min improvement to count as "better"

# Model inference latency benchmark (forward pass only) after each run, so
# latency is comparable across precision x capacity independently of the
# Java simulator step time.
latency:
  benchmark: true
  n_samples: 200
  warmup: 20
  # P1: single-sample latency is launch-bound, so the throughput-vs-batch curve is
  # what actually exposes a kernel advantage. Every batch listed here is measured
  # and stored per run in the results CSV column `throughput_by_batch`.
  throughput_batch_sizes: [1, 8, 32, 128]
  # Primary batch kept in the scalar `throughput_pps` / `throughput_batch_size`
  # columns for backward compatibility.
  throughput_batch_size: 64
  throughput_n_batches: 200

# Where per-combination results are aggregated for later comparison.
results:
  csv_dir: "outputs/results"

reward:
  # Energy-only design (Task 2): r_t = -energy_delta / E_step_max.
  # Old adaptive weights (w_perf_init, w_energy_init, w_cost_init,
  # weight_lr, floors) are deprecated and ignored by RewardManager.
  target_utilization: 0.70  # kept for benchmark reference only
  migration_penalty: 0.10
  # E_step_max = sum([250, 200, 300, 220]) * 1.0s / 3600 = ~0.2694 wh
  e_step_max_wh: 0.2694

native_precision:
  enabled: true
  quantize_activations: true
  precisions:
    - {precision: 32,      device: cuda, label: fp32-gpu}
    - {precision: 16,      device: cuda, label: fp16-gpu}
    - {precision: bf16,    device: cuda, label: bf16-gpu}
    - {precision: 32,      device: cpu,  label: fp32-cpu}
    - {precision: ternary, device: cpu,  label: ternary-cpu}
  learning_rate_overrides:
    ternary: 0.0003
    16: 0.0003
    32: 0.0005
  capacity:
    hidden_sizes: [64, 128, 256, 512, 1024, 2048, 4096]
    # Vector de profundidades: H4 barre cada valor (por ahora 1 y 2). El total de
    # corridas se multiplica por len(n_hidden_layers).
    n_hidden_layers: [1, 2]
    max_hidden_size:
      32: 2048           # fp32 on CPU becomes too slow beyond 2048
      16: 4096           # applies to fp16 and bf16 (both 16-bit)
      ternary: 4096
