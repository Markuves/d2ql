experiment:
  id: "h4_native_precision"
  hypothesis: "H4"
  seed: 42
  description: >
    Native bit-width training from initialization. The Q-network is created
    and updated as a ternary (1.58-bit), 4-bit, 8-bit, 16-bit, or 32-bit
    model from episode 0. This is not H2 post-training quantization (no
    FP32 checkpoint is converted after the fact) and not quantization-aware
    training (no FakeQuantize observers or FP32 shadow weights). INT4/INT8
    parameters live on a signed integer grid; ternary uses BitNet-style
    weights in {-1, 0, +1}. Both are re-snapped after every optimizer step.
    16/32 use the corresponding floating-point dtype for weights, activations,
    and gradients (no AMP mixed precision).

datacenter:
  n_cloud_hosts: 4
  n_edge_nodes: 0

py4j:
  host: "java-sim"
  port: 25333

workload:
  trace_path: "data/workload.csv.gz"
  episode_length: 50
  shuffle: false

queue:
  urgency_weight: 0.6
  demand_weight: 0.4

agent:
  precision: "32"          # overridden per run from native_precision.bits
  learning_rate: 0.0005
  gamma: 0.98
  target_update_freq: 750
  batch_size: 64
  replay_buffer_capacity: 100_000
  replay_buffer_warmup: 2000
  gradient_clip_norm: 10.0
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay: 0.995
  per_alpha: 0.6
  per_beta_start: 0.4
  per_beta_end: 1.0

training:
  n_episodes: 600
  eval_every_n_episodes: 50
  checkpoint_dir: "outputs/checkpoints/h4"
  tensorboard_dir: "outputs/tensorboard"

reward:
  target_utilization: 0.70
  migration_penalty: 0.10
  weight_lr: 0.01
  w_perf_floor: 0.2
  w_energy_floor: 0.1
  w_cost_floor: 0.1
  w_perf_init: 0.4
  w_energy_init: 0.3
  w_cost_init: 0.3

# Train a separate agent from scratch at each bit-width.
native_precision:
  enabled: true
  bits: [ternary, 4, 8, 16, 32]
  quantize_activations: true
  learning_rate_overrides:
    ternary: 0.00005
    4: 0.0001
    8: 0.0002
    16: 0.0003
    32: 0.0005
