experiment:
  id: "h5_heuristics"
  hypothesis: "H5"
  seed: 42
  description: >
    Baseline comparison: four traditional load-balancing heuristics evaluated
    in the SAME CloudSim environment and on the SAME held-out workload as the
    H4 DDQN agent. The heuristics collect the same business metrics (mean
    reward, makespan, energy, cost) plus their per-decision
    latency, so the learned policy can be compared head-to-head with classic
    baselines. Metrics are written to outputs/results/h5_results.csv.

py4j:
  host: "java-sim"
  port: 25333

# Must match the H4 workload settings (episode_length, holdout_frac, time scale,
# seed) so the heuristics and the agent are evaluated on the identical held-out
# windows. H4 sets `simulation_time_scale: 0.01`; using a different value here
# makes energy/makespan/reward incomparable with the DDQN rows.
workload:
  trace_path: "data/workload.csv.gz"
  episode_length: 50
  shuffle: false
  holdout_frac: 0.2
  simulation_time_scale: 0.01

# Same number of held-out episodes the H4 agent is evaluated on.
evaluation:
  n_episodes: 10

# Reward: energy only (r_t = -energy_delta / E_step_max), computed in
# d2ql.reward.RewardManager. Heuristics never adapt anything; the comparable
# axis against the DDQN rows is the weight-independent business metrics.

# Traditional load-balancing baselines to sweep (no training).
heuristics:
  enabled: true
  policies: [round_robin, random, least_loaded, least_combined]
  seed: 42

training:
  checkpoint_dir: "outputs/checkpoints/h5"
  tensorboard_dir: "outputs/tensorboard"

results:
  csv_dir: "outputs/results"
