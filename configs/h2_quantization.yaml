experiment:
  id: "h2_quantization"
  hypothesis: "H2"
  seed: 42
  description: >
    Post-training quantization experiment. A fully trained FP32 checkpoint
    from H1 is quantized to INT8 (dynamic) and FP16. Benchmarks compare
    model size, inference latency, and greedy action agreement against
    the FP32 baseline. No additional training is performed.

datacenter:
  n_cloud_hosts: 4
  n_edge_nodes: 0

py4j:
  host: "java-sim"
  port: 25333

workload:
  trace_path: "data/workload.csv.gz"
  episode_length: 50
  shuffle: false          # H2 uses fixed workload windows for deterministic comparison

queue:
  urgency_weight: 0.6
  demand_weight: 0.4

agent:
  precision: "fp32"       # training precision — quantization happens post-training
  learning_rate: 0.0005
  gamma: 0.98
  target_update_freq: 750
  batch_size: 64
  replay_buffer_capacity: 100_000
  replay_buffer_warmup: 2000
  gradient_clip_norm: 10.0
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay: 0.995
  per_alpha: 0.6
  per_beta_start: 0.4
  per_beta_end: 1.0

training:
  n_episodes: 600
  eval_every_n_episodes: 50
  checkpoint_dir: "outputs/checkpoints/h2"
  tensorboard_dir: "outputs/tensorboard"

reward:
  target_utilization: 0.70
  migration_penalty: 0.10
  weight_lr: 0.01
  w_perf_floor: 0.2
  w_energy_floor: 0.1
  w_cost_floor: 0.1
  w_perf_init: 0.4
  w_energy_init: 0.3
  w_cost_init: 0.3

# H2-specific quantization settings
quantization:
  enabled: true
  checkpoint_path: "outputs/checkpoints/h2/checkpoint_final.pt"
  output_dir: "outputs/checkpoints/quantized"
  modes:
    - "int8"              # dynamic INT8 quantization via torch.quantization
    - "fp16"              # half-precision cast, CUDA Tensor Core acceleration
  benchmark_n_samples: 1000   # samples for action agreement measurement
  benchmark_n_runs: 500       # inference runs for latency averaging
