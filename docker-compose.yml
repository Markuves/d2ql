services:
  java-sim:
    build:
      context: .
      dockerfile: Dockerfile.java
    container_name: java-sim
    ports:
      - "25333:25333"
    environment:
      # pass GATEWAY_PORT so SimulationGateway reads it from env
      - GATEWAY_PORT=25333
    volumes:
      - ./data:/app/data
      # GC logs + heap dump (see Dockerfile.java). A named volume, not a bind
      # mount: the container runs as d2ql (uid 999) and a host directory is not
      # writable by it, which makes -Xlog fail and kills the JVM at startup.
      # Docker initialises the volume with /app/logs' owner from the image.
      # Read them with: docker compose cp java-sim:/app/logs ./java-logs
      - java-logs:/app/logs
    restart: unless-stopped
    networks:
      - d2ql-net
    # health check so python-agent waits for the Py4j gateway to be
    # actually listening, not just for the container to have started
    healthcheck:
      # Real connect probe on the gateway port: bash fails the /dev/tcp
      # redirect when nothing accepts on 25333, and the gateway JVM must still
      # be the container's main process. 3s (not 1s) so a JVM in a long GC pause
      # under load is not reported unhealthy and restarted.
      test:
        - CMD-SHELL
        - >-
          timeout 3 bash -c 'exec 3<>/dev/tcp/127.0.0.1/25333' &&
          grep -qa gateway.jar /proc/1/cmdline
      interval: 5s
      timeout: 5s
      retries: 10
      # start_period gives the JVM time to boot before failures count 
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  python-agent:
    build:
      context: .
      dockerfile: Dockerfile.python
      args:
        # REPO-09: bake the commit so provenance works inside the image.
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: python-agent
    # Compose 5 + NVIDIA CDI: attach the host GPU. `deploy.devices` is
    # Swarm-only and was ignored by `docker compose up`, so CUDA init failed.
    gpus: all
    runtime: nvidia
    user: "0:0"
    ipc: host
    # Torch needs nvidia-uvm and nvidia-caps; nvidia-smi does not.
    # Driver 610 CUDA 999 ("unknown error") if these are missing in the container.
    devices:
      - /dev/nvidia0
      - /dev/nvidiactl
      - /dev/nvidia-modeset
      - /dev/nvidia-uvm
      - /dev/nvidia-uvm-tools
      - nvidia.com/gpu=all
    volumes:
      - ./configs:/app/configs
      - ./data:/app/data
      - ./outputs:/app/outputs
      - /dev/nvidia-caps:/dev/nvidia-caps
    depends_on:
      java-sim:
        condition: service_healthy
    environment:
      - JAVA_HOST=java-sim
      - JAVA_PORT=25333
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
      - NVIDIA_DISABLE_REQUIRE=1
      - CUDA_MODULE_LOADING=LAZY
    restart: on-failure
    networks:
      - d2ql-net
    command: ["python", "main.py", "--config", "configs/h4_native_precision.yaml", "--resume"]
    logging:
      driver: json-file
      options:
        # Enough history to survive a 26h/65-restart incident (was 10m x 3,
        # which discarded the evidence of the previous crash).
        max-size: "100m"
        max-file: "5"

  tensorboard:
    build:
      context: .
      dockerfile: Dockerfile.python
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: tensorboard
    working_dir: /app
    environment:
      # This service does not need a GPU; avoid the CUDA image warning.
      - NVIDIA_VISIBLE_DEVICES=void
    command:
      [
        "python", "-m", "tensorboard.main",
        "--logdir", "/app/outputs/tensorboard",
        "--host", "0.0.0.0",
        "--port", "6006",
        "--reload_interval", "2",
        "--reload_multifile=true",
        "--load_fast=false",
      ]
    ports:
      - "6006:6006"
    volumes:
      - ./outputs:/app/outputs
    depends_on:
      - python-agent
    networks:
      - d2ql-net

# explicit named network makes topology clear and debuggable 
networks:
  d2ql-net:
    driver: bridge

# named volume declaration for outputs persistence 
volumes:
  outputs:
  # java-sim diagnostics: GC logs and the heap dump written on OOM.
  java-logs:
