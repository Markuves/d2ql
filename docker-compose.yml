services:
  java-sim:
    build:
      context: .
      dockerfile: Dockerfile.java
    container_name: java-sim
    ports:
      - "25333:25333"
    environment:
      # pass GATEWAY_PORT so SimulationGateway reads it from env
      - GATEWAY_PORT=25333
      - DATASET_PATH=/app/data/workload.csv.gz
      - WORKLOAD_TIME_SCALE=0.001
      - WORKLOAD_MIPS=1000
      - WINDOW_DURATION=60000
      - MAX_CLOUDLETS_PER_WINDOW=100
      - INITIAL_WINDOW_START=0
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - d2ql-net
    # health check so python-agent waits for the Py4j gateway to be
    # actually listening, not just for the container to have started 
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c 'cat < /dev/null > /dev/tcp/localhost/25333' && echo ok"]
      interval: 5s
      timeout: 3s
      retries: 10
      # start_period gives the JVM time to boot before failures count 
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  python-agent:
    build:
      context: .
      dockerfile: Dockerfile.python
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    container_name: python-agent
    # condition: service_healthy blocks startup until the
    # health check above passes, not just until the container starts 
    depends_on:
      java-sim:
        condition: service_healthy
    environment:
      - JAVA_HOST=java-sim
      - JAVA_PORT=25333
      - DATASET_PATH=/app/data/workload.csv.gz
      - WORKLOAD_TIME_SCALE=0.001
      - WORKLOAD_MIPS=1000
      - WINDOW_DURATION=60000
      - MAX_CLOUDLETS_PER_WINDOW=100
      - INITIAL_WINDOW_START=0
    volumes:
      - ./configs:/app/configs
      - ./data:/app/data
      #  named volume for outputs instead of a raw bind mount 
      - ./outputs:/app/outputs
    restart: on-failure
    networks:
      - d2ql-net
    command: ["uv", "run", "python", "main.py", "--config", "configs/h1_adaptive_baseline.yaml"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  tensorboard:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: tensorboard
    working_dir: /app
    command: ["uv", "run", "tensorboard", "--logdir", "/app/outputs/tensorboard", "--host", "0.0.0.0", "--port", "6006", "--reload_interval", "2", "--load_fast=false"]
    ports:
      - "6006:6006"
    volumes:
      - ./outputs:/app/outputs
    depends_on:
      - python-agent
    networks:
      - d2ql-net

# explicit named network makes topology clear and debuggable 
networks:
  d2ql-net:
    driver: bridge

# named volume declaration for outputs persistence 
volumes:
  outputs:
