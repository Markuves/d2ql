services:
  java-sim:
    build:
      context: .
      dockerfile: Dockerfile.java
    container_name: java-sim
    ports:
      - "25333:25333"
    environment:
      # pass GATEWAY_PORT so SimulationGateway reads it from env
      - GATEWAY_PORT=25333
      - DATASET_PATH=/app/data/workload.csv.gz
      - WORKLOAD_TIME_SCALE=0.001
      - WORKLOAD_MIPS=1000
      - WINDOW_DURATION=60000
      - MAX_CLOUDLETS_PER_WINDOW=100
      - INITIAL_WINDOW_START=0
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - d2ql-net
    # health check so python-agent waits for the Py4j gateway to be
    # actually listening, not just for the container to have started 
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c 'cat < /dev/null > /dev/tcp/localhost/25333' && echo ok"]
      interval: 5s
      timeout: 3s
      retries: 10
      # start_period gives the JVM time to boot before failures count 
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  python-agent:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: python-agent
    # Compose 5 + NVIDIA CDI: attach the host GPU. `deploy.devices` is
    # Swarm-only and was ignored by `docker compose up`, so CUDA init failed.
    gpus: all
    runtime: nvidia
    user: "0:0"
    ipc: host
    # Torch needs nvidia-uvm and nvidia-caps; nvidia-smi does not.
    # Driver 610 CUDA 999 ("unknown error") if these are missing in the container.
    devices:
      - /dev/nvidia0
      - /dev/nvidiactl
      - /dev/nvidia-modeset
      - /dev/nvidia-uvm
      - /dev/nvidia-uvm-tools
      - nvidia.com/gpu=all
    volumes:
      - ./configs:/app/configs
      - ./data:/app/data
      - ./outputs:/app/outputs
      - /dev/nvidia-caps:/dev/nvidia-caps
    depends_on:
      java-sim:
        condition: service_healthy
    environment:
      - JAVA_HOST=java-sim
      - JAVA_PORT=25333
      - DATASET_PATH=/app/data/workload.csv.gz
      - WORKLOAD_TIME_SCALE=0.001
      - WORKLOAD_MIPS=1000
      - WINDOW_DURATION=60000
      - MAX_CLOUDLETS_PER_WINDOW=100
      - INITIAL_WINDOW_START=0
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
      - NVIDIA_DISABLE_REQUIRE=1
      - CUDA_MODULE_LOADING=LAZY
    restart: on-failure
    networks:
      - d2ql-net
    command: ["python", "main.py", "--config", "configs/h4_native_precision.yaml"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  tensorboard:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: tensorboard
    working_dir: /app
    environment:
      # This service does not need a GPU; avoid the CUDA image warning.
      - NVIDIA_VISIBLE_DEVICES=void
    command:
      [
        "python", "-m", "tensorboard.main",
        "--logdir", "/app/outputs/tensorboard",
        "--host", "0.0.0.0",
        "--port", "6006",
        "--reload_interval", "2",
        "--load_fast=false",
      ]
    ports:
      - "6006:6006"
    volumes:
      - ./outputs:/app/outputs
    depends_on:
      - python-agent
    networks:
      - d2ql-net

# explicit named network makes topology clear and debuggable 
networks:
  d2ql-net:
    driver: bridge

# named volume declaration for outputs persistence 
volumes:
  outputs:
